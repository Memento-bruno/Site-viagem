name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy oficial do Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O Pages precisa estar ligado uma vez, à mão, em
      # Settings > Pages > Source: "GitHub Actions".
      # O GITHUB_TOKEN consegue publicar, mas não consegue criar o site
      # do zero ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      # Site estático: sobe a raiz do repositório como está
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v4
